name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $tag is not vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $tag is on a commit that main does not contain."
            exit 1
          fi
          version="$(sed -n 's/^const Version = "\(.*\)"$/\1/p' version.go)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match version.go (v$version)."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists and is left as it is."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Write the notes
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          api="$(awk '$1 == "go.toshicloud.io/api" { print $2; exit }' go.mod)"
          {
            echo "Install with \`go get go.toshicloud.io/toshi@$tag\`. The module path is \`go.toshicloud.io/toshi\`, and \`go.mod\` pins the API module \`go.toshicloud.io/api\` at $api."
            echo
            if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
              git for-each-ref --format='%(contents)' "refs/tags/$tag"
            else
              prev="$(git describe --tags --abbrev=0 "$tag^")"
              echo "What changed since $prev:"
              echo
              git log --no-merges --format='- %s' "$prev..$tag"
            fi
          } > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
